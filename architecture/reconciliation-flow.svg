<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260">
  <rect width="880" height="260" fill="#f7f6f3"/>
  <text x="24" y="36" font-family="sans-serif" font-size="18" fill="#1c1917">Reconciliation</text>
  <rect x="40" y="80" width="200" height="80" rx="8" fill="#fff" stroke="#44403c"/>
  <text x="56" y="116" font-family="sans-serif" font-size="14" fill="#1c1917">Socket events</text>
  <text x="56" y="138" font-family="sans-serif" font-size="13" fill="#44403c">acks, fills, cancels</text>
  <rect x="320" y="80" width="220" height="80" rx="8" fill="#fff" stroke="#44403c"/>
  <text x="336" y="116" font-family="sans-serif" font-size="14" fill="#1c1917">Exchange state</text>
  <text x="336" y="138" font-family="sans-serif" font-size="13" fill="#44403c">plus HTTP snapshot</text>
  <rect x="620" y="80" width="220" height="80" rx="8" fill="#fff" stroke="#44403c"/>
  <text x="636" y="116" font-family="sans-serif" font-size="14" fill="#1c1917">Trading state</text>
  <text x="636" y="138" font-family="sans-serif" font-size="13" fill="#44403c">positions and orders</text>
  <path d="M240 120 H320 M540 120 H620" stroke="#44403c"/>
  <text x="40" y="200" font-family="sans-serif" font-size="13" fill="#44403c">Startup and a periodic pass compare the two states.</text>
  <text x="40" y="224" font-family="sans-serif" font-size="13" fill="#44403c">A paper-process restart drops the exchange account. Internal journals can then disagree until reset.</text>
</svg>
