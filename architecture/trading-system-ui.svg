<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680">
  <rect width="1080" height="680" fill="#f7f6f3"/>
  <text x="28" y="36" font-family="sans-serif" font-size="22" fill="#1c1917">Trading system UI</text>
  <text x="28" y="58" font-family="sans-serif" font-size="13" fill="#57534e">Thin gRPC-Web client. No direct exchange sockets.</text>

  <rect x="28" y="80" width="680" height="360" rx="10" fill="#fff" stroke="#44403c"/>
  <text x="44" y="108" font-family="sans-serif" font-size="14" fill="#1c1917">Browser</text>
  <text x="44" y="136" font-family="sans-serif" font-size="12" fill="#292524">Welcome · sign in · connect endpoint</text>
  <text x="44" y="156" font-family="sans-serif" font-size="12" fill="#292524">Trading console</text>
  <text x="44" y="188" font-family="sans-serif" font-size="12" fill="#292524">Screens</text>
  <text x="60" y="208" font-family="sans-serif" font-size="12" fill="#292524">Spot monitor  laboratory path</text>
  <text x="60" y="228" font-family="sans-serif" font-size="12" fill="#292524">Futures monitor · DEX monitor  other runner modes</text>
  <text x="44" y="260" font-family="sans-serif" font-size="12" fill="#292524">Client store</text>
  <text x="60" y="280" font-family="sans-serif" font-size="12" fill="#292524">StreamMonitoringData ~1 Hz</text>
  <text x="60" y="300" font-family="sans-serif" font-size="12" fill="#292524">GetLevels poll · GetTradingStatus</text>
  <text x="44" y="332" font-family="sans-serif" font-size="12" fill="#292524">Spot panels: orders, balances, book, levels, indicators, trades</text>
  <text x="44" y="352" font-family="sans-serif" font-size="12" fill="#292524">Operator controls: Pause, Cancel working, Flatten, Resume, global toggle</text>
  <text x="44" y="388" font-family="sans-serif" font-size="12" fill="#57534e">UI never opens a socket to the paper exchange.</text>

  <rect x="740" y="80" width="312" height="160" rx="10" fill="#e7e5e4" stroke="#44403c"/>
  <text x="756" y="108" font-family="sans-serif" font-size="14" fill="#1c1917">Auth edge</text>
  <text x="756" y="136" font-family="sans-serif" font-size="12" fill="#292524">Auth API</text>
  <text x="756" y="156" font-family="sans-serif" font-size="12" fill="#292524">Credential database</text>
  <text x="756" y="176" font-family="sans-serif" font-size="12" fill="#292524">Local demonstration session</text>
  <text x="756" y="208" font-family="sans-serif" font-size="12" fill="#57534e">Not exchange authorization</text>

  <rect x="740" y="270" width="312" height="170" rx="10" fill="#e7e5e4" stroke="#44403c"/>
  <text x="756" y="298" font-family="sans-serif" font-size="14" fill="#1c1917">gRPC-Web proxy</text>
  <text x="756" y="326" font-family="sans-serif" font-size="12" fill="#292524">Envoy grpc_web filter</text>
  <text x="756" y="346" font-family="sans-serif" font-size="12" fill="#292524">Native gRPC to runner :50051</text>
  <text x="756" y="366" font-family="sans-serif" font-size="12" fill="#292524">Optional operator token inject</text>
  <text x="756" y="398" font-family="sans-serif" font-size="12" fill="#57534e">Empty token file in paper lab</text>

  <rect x="28" y="480" width="1024" height="160" rx="10" fill="#fff" stroke="#44403c"/>
  <text x="44" y="512" font-family="sans-serif" font-size="14" fill="#1c1917">Trading runner</text>
  <text x="44" y="540" font-family="sans-serif" font-size="12" fill="#292524">TradingCliService owns monitoring, levels, and operator commands.</text>
  <text x="44" y="560" font-family="sans-serif" font-size="12" fill="#292524">The browser is not exchange authority. Venue and environment labels come from the runner.</text>
  <text x="44" y="592" font-family="sans-serif" font-size="12" fill="#57534e">Laboratory banner: PAPER · LOCAL · EXCHANGE.</text>
</svg>
