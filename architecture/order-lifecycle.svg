<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <rect width="900" height="280" fill="#f7f6f3"/>
  <text x="24" y="36" font-family="sans-serif" font-size="18" fill="#1c1917">Order lifecycle</text>
  <g font-family="sans-serif" font-size="13" fill="#1c1917">
    <rect x="24" y="70" width="120" height="48" rx="6" fill="#fff" stroke="#44403c"/>
    <text x="40" y="99">Level signal</text>
    <rect x="170" y="70" width="120" height="48" rx="6" fill="#fff" stroke="#44403c"/>
    <text x="198" y="99">Risk check</text>
    <rect x="316" y="70" width="130" height="48" rx="6" fill="#fff" stroke="#44403c"/>
    <text x="332" y="99">Place on socket</text>
    <rect x="472" y="70" width="130" height="48" rx="6" fill="#fff" stroke="#44403c"/>
    <text x="500" y="99">Acknowledgement</text>
    <rect x="628" y="70" width="110" height="48" rx="6" fill="#fff" stroke="#44403c"/>
    <text x="660" y="99">Fill</text>
    <rect x="760" y="70" width="116" height="48" rx="6" fill="#fff" stroke="#44403c"/>
    <text x="776" y="99">State update</text>
  </g>
  <path d="M144 94 H170 M290 94 H316 M446 94 H472 M602 94 H628 M738 94 H760" stroke="#44403c"/>
  <text x="24" y="160" font-family="sans-serif" font-size="13" fill="#44403c">A failed risk check stops the sequence before a place command.</text>
  <text x="24" y="184" font-family="sans-serif" font-size="13" fill="#44403c">The command reply is read on the same trade socket. A missing reply is not treated as a second place.</text>
  <text x="24" y="208" font-family="sans-serif" font-size="13" fill="#44403c">HTTP snapshots are used to reconcile, not to submit a second order.</text>
</svg>
